name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-ui:
    name: Windows Qt desktop
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: 6.10.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake --preset ci-windows-desktop

      - name: Build
        run: cmake --build --preset ci-windows-desktop --parallel

      - name: Test
        run: ctest --preset ci-windows-desktop

      - name: Package portable validation client
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $binaryDirectory = Resolve-Path "build/ci-windows-desktop/apps/desktop/Release"
          $packageDirectory = Join-Path $env:RUNNER_TEMP "ScreenShare-portable"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null

          $executable = Join-Path $binaryDirectory "ScreenShare.exe"
          Copy-Item -LiteralPath $executable -Destination $packageDirectory
          Copy-Item -LiteralPath (Join-Path $binaryDirectory "livekit.dll") -Destination $packageDirectory
          Copy-Item -LiteralPath (Join-Path $binaryDirectory "livekit_ffi.dll") -Destination $packageDirectory
          Copy-Item -LiteralPath "LICENSE" -Destination $packageDirectory
          Copy-Item -LiteralPath "packaging/VALIDATION-README.txt" -Destination $packageDirectory

          & windeployqt --release --no-translations --no-opengl-sw --dir $packageDirectory (Join-Path $packageDirectory "ScreenShare.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          $requiredFiles = @(
            "ScreenShare.exe",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "livekit.dll",
            "livekit_ffi.dll",
            "platforms/qwindows.dll",
            "VALIDATION-README.txt"
          )
          foreach ($relativePath in $requiredFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageDirectory $relativePath))) {
              throw "Portable package is missing $relativePath"
            }
          }

      - name: Upload portable validation client
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-share-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/ScreenShare-portable
          if-no-files-found: error
          retention-days: 14

  node-api:
    name: Node session API
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate development infrastructure
        env:
          LIVEKIT_API_KEY: ci-dev-key
          LIVEKIT_API_SECRET: ci-dev-secret-at-least-32-characters
          TURN_SHARED_SECRET: ci-turn-secret-at-least-32-characters
        run: docker compose -f infra/compose.yaml config --quiet

  windows-core:
    name: Windows core
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Show toolchain
        run: cmake --version

      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        run: cmake --build --preset ci-windows --parallel

      - name: Test
        run: ctest --preset ci-windows
