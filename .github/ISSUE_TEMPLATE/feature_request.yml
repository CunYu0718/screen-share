name: Feature request
description: 提议与当前路线兼容的改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户场景和当前限制，不要只描述界面方案。
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: 建议里程碑
      options:
        - M0 Engineering Baseline
        - M1 2K60 Media Spike
        - M2 Room MVP
        - M3 Adaptive Media
        - M4 20-Viewer Capacity
        - M5 Release Candidate
        - M6 Pilot
        - MVP 之后
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明方案、替代方案、性能与安全影响。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 提供可以客观验证的完成条件。
    validations:
      required: true
