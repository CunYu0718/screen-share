name: Bug report
description: 报告可复现的功能或性能问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请使用 Security 私密报告，不要在公开 Issue 中提交令牌、加入码、屏幕内容或敏感日志。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明实际行为与预期行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小、稳定的复现过程。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Windows 版本、GPU、驱动、显示器、网络条件和客户端提交或版本。
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: 指标
      description: 如相关，请提供 fps、延迟、码率、丢包、CPU/GPU 和持续时间。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除令牌、加入码、个人屏幕内容和敏感信息。
          required: true
